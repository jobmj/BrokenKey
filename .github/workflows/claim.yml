name: Issue Claim Bot

on:
  issue_comment:
    types: [created]

permissions:
  issues: write

jobs:
  claim:
    if: "!github.event.issue.pull_request && (contains(github.event.comment.body, '/claim') || contains(github.event.comment.body, '.take') || contains(github.event.comment.body, '!claim') || contains(github.event.comment.body, '/pass') || contains(github.event.comment.body, '/open'))"
    runs-on: ubuntu-latest
    steps:
      - name: Process Claim Request
        uses: actions/github-script@v7
        with:
          script: |
            const user = context.payload.comment.user.login;
            const commentBody = context.payload.comment.body;
            const issueNumber = context.payload.issue.number;
            const currentIssueUrl = context.payload.issue.html_url;
            const issueAuthor = context.payload.issue.user.login;

            // List of maintainers across repositories
            const MAINTAINERS = ['ras-al', 'prinzez', 'adwaith620', 'nillubtw', 'antonl-dev', 'hrudulmmn', 'ganes4real'];
            const isUserMaintainer = MAINTAINERS.includes(user.toLowerCase());
            const isAuthorMaintainer = MAINTAINERS.includes(issueAuthor.toLowerCase());

            // 0. Ensure issue is open and eligible
            if (context.payload.issue.state !== 'open') {
              return;
            }

            const labels = (context.payload.issue.labels || []).map((l) => l.name);

            // Handle /pass or /open (releases an issue to the community)
            if (commentBody.includes('/pass') || commentBody.includes('/open')) {
              if (user.toLowerCase() === issueAuthor.toLowerCase() || isUserMaintainer) {
                if (!labels.includes('up-for-grabs')) {
                  await github.rest.issues.addLabels({
                    ...context.repo,
                    issue_number: issueNumber,
                    labels: ['up-for-grabs']
                  });
                }
                if (context.payload.issue.assignees && context.payload.issue.assignees.length > 0) {
                  await github.rest.issues.removeAssignees({
                    ...context.repo,
                    issue_number: issueNumber,
                    assignees: context.payload.issue.assignees.map((a) => a.login)
                  });
                }
                await github.rest.issues.createComment({
                  ...context.repo,
                  issue_number: issueNumber,
                  body: `📢 @${user} has released this issue! It is now tagged \`up-for-grabs\` and available for any eligible contributor to claim with \`/claim\`.`
                });
              } else {
                await github.rest.issues.createComment({
                  ...context.repo,
                  issue_number: issueNumber,
                  body: `⚠️ @${user} Only the issue author (@${issueAuthor}) or a maintainer can release this issue.`
                });
              }
              return;
            }

            // Normal /claim processing
            if (!labels.includes('soc-s1')) {
              await github.rest.issues.createComment({
                ...context.repo,
                issue_number: issueNumber,
                body: `@${user} Only issues tagged with \`soc-s1\` can be claimed.`
              });
              return;
            }

            if (labels.includes('spam') || labels.includes('invalid')) {
              return;
            }

            // 1. Author Priority Window (24 hours exclusive for the bug finder)
            const isUpForGrabs = labels.includes('up-for-grabs') || labels.includes('good-first-issue');
            if (!isAuthorMaintainer && !isUpForGrabs && user.toLowerCase() !== issueAuthor.toLowerCase() && !isUserMaintainer) {
              const issueAgeHours = (Date.now() - new Date(context.payload.issue.created_at).getTime()) / (1000 * 60 * 60);
              if (issueAgeHours <= 24) {
                const remainingHours = Math.max(1, Math.round(24 - issueAgeHours));
                await github.rest.issues.createComment({
                  ...context.repo,
                  issue_number: issueNumber,
                  body: `🛡️ @${user} **Author Priority Active:** This issue was discovered and reported by @${issueAuthor}.\n\nIn FOSSSoC, the contributor who hunts and documents a defect has **24 hours of exclusive first rights** to claim it (~${remainingHours}h remaining).\n\nIf @${issueAuthor} does not claim it within 24 hours (or comments \`/pass\`), it will automatically open for the community!`
                });
                return;
              } else {
                // Priority window expired! Tag up-for-grabs
                await github.rest.issues.addLabels({
                  ...context.repo,
                  issue_number: issueNumber,
                  labels: ['up-for-grabs']
                });
              }
            }

            // 2. Check if the issue is already assigned
            if (context.payload.issue.assignees && context.payload.issue.assignees.length > 0) {
              const currentAssignee = context.payload.issue.assignees[0].login;
              if (currentAssignee.toLowerCase() === user.toLowerCase()) {
                await github.rest.issues.createComment({
                  ...context.repo,
                  issue_number: issueNumber,
                  body: `@${user} You are already assigned to this issue! 🚀`
                });
                return;
              }
              await github.rest.issues.createComment({
                ...context.repo,
                issue_number: issueNumber,
                body: `@${user} This issue is currently assigned to @${currentAssignee}. Please look for other open issues tagged with \`soc-s1\`!`
              });
              return;
            }

            // 3. Enforce 1-Issue Rule across the organization
            try {
              const search = await github.rest.search.issuesAndPullRequests({
                q: `org:${context.repo.owner} is:issue is:open assignee:${user}`
              });

              const otherAssigned = search.data.items.filter(
                (item) => item.html_url.toLowerCase() !== currentIssueUrl.toLowerCase()
              );

              if (otherAssigned.length > 0) {
                const active = otherAssigned[0];
                await github.rest.issues.createComment({
                  ...context.repo,
                  issue_number: issueNumber,
                  body: `⚠️ @${user} **1-Issue Rule:** You already have an active assigned issue (${active.html_url}).\n\nYou must submit your pull request and have it merged or closed before claiming another issue!`
                });
                return;
              }
            } catch (err) {
              console.log('Search warning (ignoring if rate-limited):', err.message);
            }

            // 4. Enforce 5-PR Repository Cap
            try {
              const repoOwner = context.repo.owner;
              const repoName = context.repo.repo;
              const prSearch = await github.rest.search.issuesAndPullRequests({
                q: `repo:${repoOwner}/${repoName} is:pr is:closed author:${user} label:soc-s1`
              });

              const mergedPRs = (prSearch.data.items || []).filter(
                (item) => item.pull_request && item.pull_request.merged_at
              );

              if (mergedPRs.length >= 5 && !isUserMaintainer) {
                await github.rest.issues.createComment({
                  ...context.repo,
                  issue_number: issueNumber,
                  body: `🛡️ @${user} **Repository Cap Reached (5/5 PRs):**\n\nYou have already merged **${mergedPRs.length} PRs** in \`${repoName}\`!\n\nPer FOSSSoC Season 1 rules, each participant can earn points for a maximum of **5 PRs per repository**.\n\nTo keep issues available for your peers and continue earning points for yourself, please pick an issue in another project (e.g., [BrokenKey](https://github.com/${repoOwner}/BrokenKey), [Cyber-Security-Simulator](https://github.com/${repoOwner}/Cyber-Security-Simulator), or [pingpanda](https://github.com/${repoOwner}/pingpanda)).\n\n*(Note: If you want to contribute purely for open-source without points, a mentor can assign you manually).*`
                });
                return;
              }
            } catch (err) {
              console.log('Repo cap check warning (ignoring if rate-limited):', err.message);
            }

            // 5. Assign the participant with Tiered Deadline
            const isEasy = labels.includes('level:easy');
            const deadlineDays = isEasy ? 3 : 5;
            const deadlineHours = deadlineDays * 24;

            await github.rest.issues.addAssignees({
              ...context.repo,
              issue_number: issueNumber,
              assignees: [user]
            });

            await github.rest.issues.createComment({
              ...context.repo,
              issue_number: issueNumber,
              body: `🎉 @${user} You have been assigned to this issue!\n\n⏳ **Deadline:** You have **${deadlineDays} days (${deadlineHours} hours)** to open a pull request.\n🔗 **Link your PR:** Make sure your pull request description includes \`Fixes #${issueNumber}\`.\n\nHappy hacking!`
            });
